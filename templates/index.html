<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>razvlecheniya</title>
    <link rel="stylesheet" href="static/style.css">
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='logo.ico') }}">
</head>
<body>

<div class="app-layout">
    <aside class="side-menu">
        <div class="brand"><a href="{{ url_for('index') }}"><img class="logo" src="static/logo.png"></a></div>
        <nav class="nav-links">
            <a href="#" class="active">Главная</a>
            <a href="{{ url_for('about') }}">О Нас</a>
        </nav>
    </aside>

    <main class="content-area">
        <div class="header-simple">
            <h1>Твои треки</h1>
            <div>
                {% if session.username %}
                    <div class="profile-menu">
                        <button class="profile-btn">{{ session.username }}</button>
                        <div class="dropdown">
                            {% if session.role == 'admin' %}
                                <a href="{{ url_for('tickets') }}">Тикеты</a>
                            {% endif %}
                            <a href="{{ url_for('upload') }}">Загрузить трек</a>
                            <a href="{{ url_for('logout') }}">Выйти</a>
                        </div>
                    </div>
                {% else %}
                    <a href="{{ url_for('login') }}" class="nav-btn-link">Вход</a>
                    <a href="{{ url_for('register') }}" class="nav-btn-link">Регистрация</a>
                {% endif %}
            </div>
        </div>

        <div class="cards-container">
            {% for track in tracks %}
                <div class="music-card" onclick="playTrack({{ loop.index0 }})">
                    <img src="{% if track.cover_file %}{{ url_for('uploads', filename=track.cover_file) }}{% else %}{{ url_for('static', filename='default.png') }}{% endif %}" class="image-box">
                    <h3>{{ track.name }}</h3>
                    <p>{{ track.author }}</p>
                </div>
            {% endfor %}
        </div>
    </main>

    <footer class="bottom-player">
        <div class="player-controls-left">
            <button class="nav-btn" onclick="previousTrack()">⏮</button>
            <button class="play-circle" id="play-btn" onclick="togglePlayPause()">▶</button>
            <button class="nav-btn" onclick="nextTrack()">⏭</button>
        </div>

        <div class="player-center-info">
            <div class="track-now">
                <img id="player-cover" src="{{ url_for('static', filename='default.png') }}" alt="Current" class="small-img">
                <div class="text-info">
                    <div id="player-title" class="t-title">Выберите трек</div>
                    <div id="player-artist" class="t-sub">-</div>
                </div>
            </div>
            <div class="timeline-wrap">
                <div id="current-time" class="time">0:00</div>
                <div class="bar-bg" id="timeline-bg"><div id="timeline-fill" class="bar-fill"></div></div>
                <div id="duration" class="time">0:00</div>
            </div>
        </div>

        <div class="player-right-volume">
            <div class="volume-container">
                <span class="vol-icon">🔊</span>
                <div class="volume-slider">
                    <div class="bar-bg" id="volume-bg"><div id="volume-fill" class="bar-fill" style="height: 50%;"></div></div>
                </div>
            </div>
        </div>
    </footer>
</div>
<audio id="main-player" preload="none"></audio>
<script>
const tracks = [
{% for track in tracks %}
    {audio: '{{ track.audio_file }}', cover: '{{ track.cover_file }}', title: '{{ track.name }}', artist: '{{ track.author }}'},
{% endfor %}
];
let currentIndex = -1;
</script>

<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
