<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тикеты</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='logo.ico') }}">
</head>
<body>

<div class="app-layout">
    <aside class="side-menu">
        <div class="brand"><a href="{{ url_for('index') }}"><img class="logo" src="static/logo.png"></a></div>
        <nav class="nav-links">
            <a href="{{ url_for('index') }}">Главная</a>
            <a href="{{ url_for('about') }}">О Нас</a>
            {% if session.username %}
                <a href="{{ url_for('upload') }}">Загрузить трек</a>
            {% endif %}
        </nav>
    </aside>

    <main class="content-area">
        <div class="header-simple">
            <h1>Тикеты на проверку</h1>
            <div>
                {% if session.username %}
                    <div class="profile-menu">
                        <button class="profile-btn">{{ session.username }}</button>
                        <div class="dropdown">
                            {% if session.role == 'admin' %}
                                <a href="{{ url_for('tickets') }}">Тикеты</a>
                            {% endif %}
                            <a href="{{ url_for('logout') }}">Выйти</a>
                        </div>
                    </div>
                {% else %}
                    <a href="{{ url_for('login') }}" class="nav-btn-link">Вход</a>
                    <a href="{{ url_for('register') }}" class="nav-btn-link">Регистрация</a>
                {% endif %}
            </div>
        </div>

        <div class="cards-container">
            {% for ticket in tickets %}
                <div class="music-card">
                    <form method="POST" action="{{ url_for('edit_ticket', ticket_id=ticket.id) }}" enctype="multipart/form-data" class="ticket-edit-form">
                        <img src="{{ url_for('uploads', filename=ticket.cover_file) if ticket.cover_file else url_for('static', filename='logo.png') }}" class="image-box">
                        <input type="text" name="title" value="{{ ticket.title }}" class="ticket-input" required>
                        <input type="text" name="artist" value="{{ ticket.artist }}" class="ticket-input" required>
                        <label class="ticket-label">Новая обложка (опционально):</label>
                        <input type="file" name="cover" accept="image/*" class="ticket-file-input">
                        <button type="submit" class="btn">Сохранить</button>
                    </form>
                    <audio controls>
                        <source src="{{ url_for('uploads', filename=ticket.audio_file) }}" type="audio/mpeg">
                    </audio>
                    <div class="card-actions">
                        <form method="POST" action="{{ url_for('approve_ticket', ticket_id=ticket.id) }}" style="display:inline;">
                            <button type="submit" class="btn">Опубликовать</button>
                        </form>
                        <form method="POST" action="{{ url_for('reject_ticket', ticket_id=ticket.id) }}" style="display:inline;">
                            <button type="submit" class="btn">Удалить</button>
                        </form>
                    </div>
                </div>
            {% endfor %}
        </div>
    </main>
</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
